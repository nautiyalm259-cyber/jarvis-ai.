
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS - Manish Sir</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#020914;color:#00cfff;
 font-family:Arial,sans-serif;text-align:center;
 min-height:100vh;overflow-x:hidden;
}
.app{padding:25px 15px;max-width:600px;margin:auto}
h1{letter-spacing:8px;text-shadow:0 0 15px #00cfff}
.sub{font-size:12px;letter-spacing:4px;color:#76cfff}
.core{
 width:210px;height:210px;border-radius:50%;
 margin:35px auto;border:3px solid #00cfff;
 display:grid;place-items:center;
 box-shadow:0 0 20px #00cfff,inset 0 0 25px #0077ff;
 animation:pulse 2s infinite;
}
.core-inner{
 width:150px;height:150px;border-radius:50%;
 border:2px solid #168fff;
 display:grid;place-items:center;
 font-size:65px;
 background:radial-gradient(circle,#064b78,#020914);
}
@keyframes pulse{
 50%{box-shadow:0 0 45px #00cfff,inset 0 0 40px #0077ff}
}
button{
 background:#003c60;color:white;
 border:1px solid #00cfff;border-radius:30px;
 padding:14px 22px;margin:8px;font-size:15px;
}
button:active{background:#087da9}
.panel{
 border:1px solid #087da9;border-radius:12px;
 padding:16px;margin:15px 0;
 background:#04182a;
}
#status{color:#75eaff}
#output{color:white;min-height:50px}
.footer{font-size:11px;color:#568ba8;margin-top:30px}
</style>
</head>

<body>
<div class="app">

<h1>J.A.R.V.I.S</h1>
<div class="sub">PERSONAL AI SYSTEM</div>

<div class="core">
 <div class="core-inner">◉</div>
</div>

<div class="panel">
 <h3>MANISH SIR</h3>
 <p id="status">SYSTEM ONLINE</p>
 <p id="output">Awaiting your command, Sir.</p>
</div>

<button onclick="greet()">GREETING</button>
<button onclick="startListening()">🎙 ACTIVATE</button>
<button onclick="stopListening()">STOP</button>

<div class="panel">
 <p>VOICE ASSISTANT</p>
 <p>Hindi + English Support</p>
 <p>JARVIS VERSION 1.0</p>
</div>

<div class="footer">
 CREATED FOR MANISH SIR | ALL SYSTEMS READY
</div>

</div>

<script>
const statusBox=document.getElementById("status");
const output=document.getElementById("output");

function speak(message){
 output.innerText=message;
 speechSynthesis.cancel();

 const speech=new SpeechSynthesisUtterance(message);
 speech.lang="en-IN";
 speech.rate=0.9;
 speech.pitch=0.85;

 const voices=speechSynthesis.getVoices();
 const indianVoice=voices.find(v=>v.lang==="en-IN")
 ||voices.find(v=>v.lang==="hi-IN");

 if(indianVoice) speech.voice=indianVoice;

 speechSynthesis.speak(speech);
}

function greet(){
 speak("Good morning, Manish Sir. JARVIS is online. All systems are operational. How may I assist you today?");
}

let recognition=null;

function startListening(){
 const SR=window.SpeechRecognition||
 window.webkitSpeechRecognition;

 if(!SR){
  speak("Voice recognition is not supported in this browser.");
  return;
 }

 recognition=new SR();
 recognition.lang="en-IN";
 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.onstart=()=>{
  statusBox.innerText="LISTENING...";
 };

 recognition.onresult=(event)=>{
  const command=event.results[0][0].transcript.toLowerCase();
  output.innerText="You: "+command;
  processCommand(command);
 };

 recognition.onerror=()=>{
  statusBox.innerText="VOICE ERROR";
 };

 recognition.onend=()=>{
  statusBox.innerText="SYSTEM ONLINE";
 };

 recognition.start();
}

function stopListening(){
 if(recognition) recognition.stop();
 speechSynthesis.cancel();
 statusBox.innerText="SYSTEM ONLINE";
 output.innerText="Assistant stopped.";
}

function processCommand(command){

 if(command.includes("hello")||
 command.includes("jarvis")){
  speak("Hello Manish Sir. I am ready.");
 }

 else if(command.includes("time")){
  speak("The current time is "+
  new Date().toLocaleTimeString("en-IN"));
 }

 else if(command.includes("date")){
  speak("Today's date is "+
  new Date().toLocaleDateString("en-IN"));
 }

 else if(command.includes("youtube")){
  speak("Opening YouTube, Manish Sir.");
  window.open("https://youtube.com","_blank");
 }

 else if(command.includes("google")){
  speak("Opening Google, Manish Sir.");
  window.open("https://google.com","_blank");
 }

 else if(command.includes("how are you")){
  speak("I am fully operational, Manish Sir.");
 }

 else if(command.includes("who are you")){
  speak("I am JARVIS, your personal AI assistant.");
 }

 else if(command.includes("namaste")||
 command.includes("hello sir")){
  speak("Namaste Manish Sir. How can I help you?");
 }

 else{
  speak("Sorry Sir, this command is not available yet.");
 }
}
</script>
</body>
</html>
